# Зелёная / красная галочка на пуше и в Pull Request.
# Смотреть: вкладка Actions → Tests, либо Checks внизу PR.
name: Tests

on:
  push:
    branches: [main, experimental]
  pull_request:
    branches: [main, experimental]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # tests/test_session.py импортирует assistant.py, а тот тянет нативные библиотеки:
      # sounddevice грузит PortAudio через ctypes, PySide6 — libGL / libEGL / xkbcommon.
      # Колёс с ними в pip нет, поэтому ставим системными пакетами.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -t . обязателен: иначе tests/__init__.py не импортируется и запрет сети не встанет.
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen  # на раннере нет дисплея
        run: python -m unittest discover -s tests -t . -v
