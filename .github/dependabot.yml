# Раз в неделю Dependabot откроет PR, если в requirements.txt
# или в GitHub Actions появилась уязвимая / устаревшая версия.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
